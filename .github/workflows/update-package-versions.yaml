name: Update Package Versions

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to update, or "all"
        required: true
        default: all
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: repo

      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify checkout
        run: |
          set -euo pipefail
          pwd
          ls -la
          git rev-parse --show-toplevel
          git status --short

      - name: Update package versions
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          chmod +x scripts/bump-version.sh scripts/update-from-github-release.sh

          if [[ -n "${INPUT_PACKAGE:-}" && "${INPUT_PACKAGE}" != "all" ]]; then
            scripts/update-from-github-release.sh "${INPUT_PACKAGE}"
          else
            while IFS= read -r meta; do
              package="$(basename "$(dirname "${meta}")")"
              scripts/update-from-github-release.sh "${package}"
            done < <(find packages -mindepth 2 -maxdepth 2 -name upstream.env | sort)
          fi

      - name: Commit and push if changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No version changes detected"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          packages="$(
            git diff --name-only \
              | awk -F/ '/^packages\/[^/]+\/[^/]+\.spec$/ {print $2}' \
              | sort -u \
              | paste -sd ' ' -
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/*.spec
          git commit -m "Update package versions"
          git push

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

      - name: Find packages missing a COPR build
        id: pending
        run: |
          set -euo pipefail

          packages=()
          for spec in packages/*/*.spec; do
            package="$(basename "$(dirname "${spec}")")"
            version="$(awk '/^Version:/ {print $2; exit}' "${spec}")"

            latest="$(
              curl -fsSL "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=bonvaffel&projectname=cli-tools&packagename=${package}&limit=1" \
                | jq -r '.items[0] // empty | "\(.state) \(.source_package.version // "")"'
            )"
            state="${latest%% *}"
            built="${latest#* }"
            built="${built%-*}"

            case "${state}" in
              pending|starting|running|importing|waiting|forked) continue ;;
            esac

            if [[ -z "${latest}" || "${state}" == "failed" || "${built}" != "${version}" ]]; then
              echo "${package}: spec=${version} copr=${built:-none} (${state:-no builds})"
              packages+=("${package}")
            fi
          done

          echo "packages=${packages[*]:-}" >> "${GITHUB_OUTPUT}"

      - name: Configure copr-cli
        if: steps.pending.outputs.packages != ''
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail

          if [[ -z "${COPR_CONFIG:-}" ]]; then
            echo "COPR_CONFIG secret is required to submit COPR builds" >&2
            exit 1
          fi

          mkdir -p ~/.config
          printf '%s\n' "${COPR_CONFIG}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Trigger COPR builds
        if: steps.pending.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.pending.outputs.packages }}
          REPO_CLONE_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [[ -z "${PACKAGES:-}" ]]; then
            echo "No package changes detected for COPR submission"
            exit 0
          fi

          cp ~/.config/copr ../copr.conf

          docker run --rm \
            -v "${PWD}/../copr.conf:/root/.config/copr:ro" \
            registry.fedoraproject.org/fedora:44 \
            bash -lc "
              set -euo pipefail
              dnf -y install copr-cli >/dev/null
              copr-cli modify bonvaffel/cli-tools --enable-net on
            "

          failed_packages=()
          for package in ${PACKAGES}; do
            package="$(printf '%s\n' "${package}" | sed -E 's#^packages/([^/]+)/[^/]+\.spec$#\1#; s#^([^/]+)\.spec$#\1#')"
            if ! docker run --rm \
              -v "${PWD}:/work:ro" \
              -v "${PWD}/../copr.conf:/root/.config/copr:ro" \
              -w /work \
              registry.fedoraproject.org/fedora:44 \
              bash -lc "
                set -euo pipefail
                dnf -y install copr-cli >/dev/null
                if ! copr-cli get-package bonvaffel/cli-tools --name '${package}' >/dev/null 2>&1; then
                  copr-cli add-package-scm bonvaffel/cli-tools \
                    --name '${package}' \
                    --clone-url '${REPO_CLONE_URL}' \
                    --subdir 'packages/${package}' \
                    --spec '${package}.spec' \
                    --webhook-rebuild off \
                    --method make_srpm
                else
                  copr-cli edit-package-scm bonvaffel/cli-tools \
                    --name '${package}' \
                    --clone-url '${REPO_CLONE_URL}' \
                    --subdir 'packages/${package}' \
                    --spec '${package}.spec' \
                    --webhook-rebuild off \
                    --method make_srpm
                fi
                copr-cli build-package bonvaffel/cli-tools \
                  --name '${package}' \
                  --enable-net on \
                  --background \
                  --nowait
              "; then
              echo "Failed to submit COPR build for ${package}" >&2
              failed_packages+=("${package}")
            fi
          done

          if [[ ${#failed_packages[@]} -gt 0 ]]; then
            echo "COPR submissions failed for: ${failed_packages[*]}" >&2
            exit 1
          else
            echo "COPR submissions succeeded for all packages: ${PACKAGES}"
          fi
